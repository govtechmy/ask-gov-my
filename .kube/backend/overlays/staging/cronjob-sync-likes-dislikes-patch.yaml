apiVersion: batch/v1
kind: CronJob
metadata:
  name: askgov-sync-likes-dislikes
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: askgov-sync-likes-dislikes
              env:
                - name: ELASTICSEARCH_URL
                  valueFrom:
                    secretKeyRef:
                      name: askgov-secret
                      key: ELASTICSEARCH_URL
                - name: ELASTICSEARCH_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: askgov-secret
                      key: ELASTICSEARCH_API_KEY
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: askgovdb-secret
                      key: DB_NAME
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: askgovdb-secret
                      key: DB_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: askgovdb-secret
                      key: DB_PASSWORD
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: askgovdb-secret
                      key: DB_HOST
                - name: DB_PORT
                  valueFrom:
                    secretKeyRef:
                      name: askgovdb-secret
                      key: DB_PORT
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: askgov-secret
                      key: AWS_REGION
                - name: RECAPTCHA_MIN_SCORE
                  valueFrom:
                    secretKeyRef:
                      name: askgov-secret
                      key: RECAPTCHA_MIN_SCORE
                - name: OPENAI_API_KEY
                  # use a dummy value, otherwise the Django app won't initialize because OpenAI's client throws an error
                  value: "0"
