apiVersion: apps/v1
kind: Deployment
metadata:
  name: askgov-backend
spec:
  template:
    spec:
      containers:
        - name: askgov-backend
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: SECRET_KEY
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_URL
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: OPENAI_API_KEY