apiVersion: kustomize.config.k8s.io/v1beta1
kind: Deployment
metadata:
  name: askgov-backend
spec:
  template:
    spec:
      containers:
        - name: askgov-backend
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-backend-secret
                  key: SECRET_KEY