apiVersion: apps/v1
kind: Deployment
metadata:
  name: askgov-backend
spec:
  template:
    spec:
      containers:
        - name: askgov-backend
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: SECRET_KEY
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_URL
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: OPENAI_API_KEY
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_PORT
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: FROM_EMAIL
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: AWS_REGION
            - name: GOOGLE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_PROJECT_ID
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_API_KEY
            - name: RECAPTCHA_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: RECAPTCHA_SITE_KEY
            - name: RECAPTCHA_MIN_SCORE
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: RECAPTCHA_MIN_SCORE
