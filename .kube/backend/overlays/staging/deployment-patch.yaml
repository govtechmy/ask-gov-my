apiVersion: apps/v1
kind: Deployment
metadata:
  name: askgov-backend
spec:
  template:
    spec:
      containers:
        - name: askgov-backend
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: SECRET_KEY
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_URL
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: ELASTICSEARCH_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: OPENAI_API_KEY
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: askgovdb-secret
                  key: DB_PORT