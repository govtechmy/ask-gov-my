apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: DEPLOYMENT_IMAGE
    # Use the correct image from AWS ECR!
    newName: 767397910274.dkr.ecr.ap-southeast-1.amazonaws.com/askgov-backend
  - name: SYNC_LIKE_DISLIKE_IMAGE
    # We use the same image, for the sync_likes_dislikes cronjob
