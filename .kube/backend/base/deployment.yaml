apiVersion: kustomize.config.k8s.io/v1beta1
kind: Deployment
metadata:
  name: askgov-backend
  labels:
    app: askgov-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: askgov-backend
  template:
    metadata:
      labels:
        app: askgov-backend
    spec:
      containers:
        - name: askgov-backend
          image: 767397910274.dkr.ecr.ap-southeast-1.amazonaws.com/askgov-backend
          ports:
            - containerPort: 8000
