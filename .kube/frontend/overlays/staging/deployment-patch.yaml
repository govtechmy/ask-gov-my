apiVersion: apps/v1
kind: Deployment
metadata:
  name: askgov-website
spec:
  template:
    spec:
      containers:
        - name: askgov-website
          env:
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: API_URL
            - name: APP_ENV
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: APP_ENV
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: APP_URL
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: AWS_REGION
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: BASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: nextauth-secret
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: NEXTAUTH_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: AUTH_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: AUTH_BASE_URL
            - name: STORAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: STORAGE_BUCKET
            - name: STORAGE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: STORAGE_BASE_URL
            - name: NEXT_PUBLIC_STORAGE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: askgovfe-secret
                  key: STORAGE_BASE_URL
            - name: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: askgov-secret
                  key: RECAPTCHA_SITE_KEY
