<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>
  <body>
    <div>Took: {{ search_result.took }}</div>
    <div>Time out: {{ search_result.timed_out }}</div>
    <div>Hits: {{ search_result.hits }}</div>
    {% for h in search_result.hits.hits %}
    <div>Hit: {{ h }}</div>
    {% endfor %}

    <code> {{ search_result }} </code>
  </body>
</html>
