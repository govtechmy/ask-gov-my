<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>

</head>
<body>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Identifier</th>
    </tr>
    </thead>
    <tbody>
    {% for a in agencies %}
    <tr>
        <td>{{ a.id }}</td>
        <td><a href="{% url 'qna' id=a.id %}">{{ a.name }}</a></td>
        <td>{{ a.identifier }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{#{% for a in agencies %}#}
{#    {{ a }}<br><br>#}
{#{% endfor %}#}
</body>
</html>
